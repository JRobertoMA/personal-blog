<style>
  html, body { margin: 0; padding: 0; background: #08090b; }
  html:not(.is-mobile), html:not(.is-mobile) body { overflow: hidden; }
  html:not(.is-mobile) #root { width: 100vw; height: 100vh; }
  #app-loading {
    position: fixed; inset: 0; background: #08090b;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', ui-monospace, monospace; color: #39ff14;
    z-index: 99999; transition: opacity .35s;
  }
  #app-loading.hidden { opacity: 0; pointer-events: none; }
  #app-loading .logo { font-size: 44px; font-weight: 700; letter-spacing: -0.04em; margin-bottom: 8px; text-shadow: 0 0 20px #39ff14; }
  #app-loading .sub { font-size: 11px; color: #a0a6b0; letter-spacing: 0.3em; text-transform: uppercase; }
  /* HTML de page.php (buscadores y sin JavaScript); React lo reemplaza al arrancar */
  .ssr { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; color: #e6e8ec; font: 16px/1.65 'Inter', system-ui, sans-serif; }
  .ssr a { color: #39ff14; }
  .ssr h1 { font-size: 30px; line-height: 1.2; margin: 18px 0 8px; }
  .ssr-nav, .ssr-crumbs, .ssr-meta, .ssr-foot, .ssr-tags, .ssr-prevnext { font-size: 14px; color: #a0a6b0; }
  .ssr-list { list-style: none; padding: 0; }
  .ssr-prevnext, .ssr-tags { margin-top: 24px; }
  .ssr-list h2 { font-size: 20px; margin: 24px 0 2px; }
  .ssr-foot { margin-top: 48px; border-top: 1px solid #2a2f38; padding-top: 16px; }
  .ssr-body pre { overflow-x: auto; padding: 12px; background: #030405; border: 1px solid #2a2f38; border-radius: 6px; }
  html:has(#root > .ssr), html:has(#root > .ssr) body { overflow: auto !important; }
  html:has(#root > .ssr) #root { height: auto !important; }
</style>
</head>
<body>

<div id="app-loading" role="status" aria-label="Cargando">
  <div class="logo">jr<span style="color:#00f0ff">·</span>os</div>
  <div class="sub">jrobertoma.com</div>
</div>

<div id="root"></div>

<noscript>
  <style>#app-loading { display: none; }</style>
  <p style="color:#a0a6b0;font-family:system-ui;padding:0 16px;text-align:center">Activa JavaScript para la versión completa (escritorio y móvil interactivos).</p>
</noscript>

<script src="assets/app.js" defer></script>
</body>
