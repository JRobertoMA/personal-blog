<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — jrobertoma.com</title>
<link rel="stylesheet" href="assets/prose.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --accent:#4f46e5;--accent-soft:#eef2ff;--accent-text:#4338ca;
  --danger:#dc2626;--success:#16a34a;--warning:#ca8a04;
  --bg:#fafafa;--bg-elev:#fff;--bg-soft:#f4f4f5;
  --border:#e4e4e7;--border-strong:#d4d4d8;
  --text:#18181b;--text-dim:#52525b;--text-faint:#a1a1aa;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow-md:0 4px 12px rgba(0,0,0,.06);--shadow-lg:0 12px 32px rgba(0,0,0,.08);
  --font-ui:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
  --sidebar-w:232px;--sidebar-w-col:56px;--topbar-h:56px;
}
[data-theme=dark]{
  --accent:#818cf8;--accent-soft:rgba(129,140,248,.12);--accent-text:#a5b4fc;
  --danger:#f87171;--success:#4ade80;--warning:#facc15;
  --bg:#0a0a0b;--bg-elev:#131316;--bg-soft:#1a1a1f;
  --border:#27272a;--border-strong:#3f3f46;
  --text:#fafafa;--text-dim:#a1a1aa;--text-faint:#71717a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 4px 12px rgba(0,0,0,.5);--shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}html,body{margin:0;padding:0;}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .18s,color .18s;}
button,input,textarea,select{font-family:inherit;}

/* Login */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-card{width:360px;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:36px 32px;box-shadow:var(--shadow-lg);}
.login-card .logo{font-family:var(--font-mono);font-size:22px;font-weight:700;letter-spacing:-.03em;margin-bottom:4px;}
.login-card .logo span{color:var(--accent);}
.login-card .subtitle{color:var(--text-dim);font-size:13px;margin-bottom:28px;}
.login-card .field{margin-bottom:14px;}
.login-card .field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;}
.login-card .field input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;outline:none;}
.login-card .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.login-card .submit{width:100%;padding:10px;background:var(--text);color:var(--bg-elev);border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity .12s;}
.login-card .submit:hover{opacity:.88;}
.login-card .submit:disabled{opacity:.5;cursor:not-allowed;}
.login-card .error{color:var(--danger);font-size:12.5px;margin-top:10px;text-align:center;}

/* Layout */
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;transition:grid-template-columns .22s cubic-bezier(.2,.8,.3,1);}
.shell.collapsed{grid-template-columns:var(--sidebar-w-col) 1fr;}

/* Sidebar */
.sidebar{background:var(--bg-elev);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;}
.sb-brand{height:var(--topbar-h);display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);gap:10px;flex-shrink:0;}
.sb-brand .mark{width:28px;height:28px;border-radius:7px;background:var(--text);color:var(--bg-elev);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:13px;flex-shrink:0;}
.sb-brand .name{font-weight:600;font-size:14px;letter-spacing:-.01em;}
.sb-brand .name .dim{color:var(--text-faint);font-weight:400;}
.collapsed .sb-brand .name{display:none;}
.sb-nav{padding:12px 8px;flex:1;overflow-y:auto;}
.sb-section{margin-bottom:4px;}
.sb-section .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:12px 12px 6px;font-weight:600;}
.collapsed .sb-section .label{display:none;}
.sb-item{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:6px;cursor:pointer;color:var(--text-dim);font-weight:500;font-size:13.5px;transition:background .12s,color .12s;margin-bottom:1px;white-space:nowrap;overflow:hidden;}
.sb-item:hover{background:var(--bg-soft);color:var(--text);}
.sb-item.active{background:var(--accent-soft);color:var(--accent-text);}
.sb-item .ico{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;font-family:var(--font-mono);}
.collapsed .sb-item .lbl,.collapsed .sb-item .badge{display:none;}
.collapsed .sb-item{justify-content:center;padding:9px;}
.sb-footer{padding:10px;border-top:1px solid var(--border);flex-shrink:0;}
.sb-user{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;}
.sb-user:hover{background:var(--bg-soft);}
.sb-user .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#818cf8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.sb-user .info{overflow:hidden;}
.sb-user .uname{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-user .role{font-size:11px;color:var(--text-faint);}
.collapsed .sb-user .info{display:none;}
.sb-actions{display:flex;gap:4px;margin-top:8px;}
.sb-icon-btn{width:32px;height:32px;border:1px solid var(--border);background:none;border-radius:6px;cursor:pointer;color:var(--text-dim);font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s;}
.sb-icon-btn:hover{background:var(--bg-soft);color:var(--text);}

/* Main */
.main{display:flex;flex-direction:column;min-height:100vh;overflow:hidden;}
.topbar{height:var(--topbar-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;background:var(--bg-elev);flex-shrink:0;}
.topbar-title{font-weight:600;font-size:15px;}
.page{padding:28px 32px;flex:1;overflow-y:auto;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:22px;font-weight:700;margin:0 0 2px;}
.page-sub{font-size:13px;color:var(--text-dim);}
.page-actions{display:flex;gap:8px;flex-shrink:0;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);background:var(--bg-elev);border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-dim);transition:background .1s,color .1s,border-color .1s;}
.btn:hover:not(:disabled){background:var(--bg-soft);color:var(--text);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover:not(:disabled){opacity:.9;}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn.danger:hover:not(:disabled){opacity:.88;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.sm{padding:5px 10px;font-size:12px;}

/* Cards & Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px;}
.stat{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:18px 20px;}
.stat .label{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.stat .value{font-size:28px;font-weight:700;font-family:var(--font-mono);margin-bottom:4px;}
.stat .delta{font-size:11.5px;color:var(--text-faint);}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:20px;}
.card-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
.card-row:last-child{border-bottom:none;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

/* Chart */
.chart{display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:12px;}
.bar{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px;transition:height .3s;}

/* Table */
.table{width:100%;border-collapse:collapse;}
.table th{font-size:11.5px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);}
.table td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
.table tr:last-child td{border-bottom:none;}
.table tr:hover td{background:var(--bg-soft);}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.toolbar input,.toolbar select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;outline:none;}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent);}

/* Status pills */
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;}
.pill.published{background:#dcfce7;color:#15803d;}[data-theme=dark] .pill.published{background:rgba(74,222,128,.15);color:#4ade80;}
.pill.draft{background:#f4f4f5;color:var(--text-dim);}
.pill.scheduled{background:#fef9c3;color:#ca8a04;}[data-theme=dark] .pill.scheduled{background:rgba(250,204,21,.12);color:#facc15;}
.pill.pending{background:#fef9c3;color:#ca8a04;}[data-theme=dark] .pill.pending{background:rgba(250,204,21,.12);color:#facc15;}
.pill.approved{background:#dcfce7;color:#15803d;}[data-theme=dark] .pill.approved{background:rgba(74,222,128,.15);color:#4ade80;}
.pill.spam{background:#fee2e2;color:#dc2626;}[data-theme=dark] .pill.spam{background:rgba(248,113,113,.12);color:#f87171;}

/* Form */
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:12.5px;font-weight:500;margin-bottom:7px;}
.form-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.form-textarea{resize:vertical;min-height:200px;font-family:var(--font-mono);font-size:12px;}
.form-select{width:100%;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}

/* Media grid */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.media-item{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg-soft);cursor:pointer;transition:border-color .15s;}
.media-item:hover{border-color:var(--accent);}
.media-thumb{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--bg-soft);font-size:32px;overflow:hidden;}
.media-thumb img{width:100%;height:100%;object-fit:cover;}
.media-info{padding:8px 10px;}
.media-name{font-size:11px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Drop zone */
.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:40px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:20px;}
.drop-zone:hover,.drop-zone.dragging{border-color:var(--accent);background:var(--accent-soft);}
.drop-zone .icon{font-size:36px;margin-bottom:8px;}
.drop-zone p{font-size:13px;color:var(--text-dim);margin:4px 0;}

/* Comments & Messages */
.thread{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);}
.thread.unread{background:var(--accent-soft);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0;color:var(--text-dim);}
.body{flex:1;min-width:0;}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.meta .name{font-weight:600;font-size:13px;}
.meta .when{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}
.meta .on{font-size:11.5px;color:var(--text-faint);}
.msg-body{font-size:13px;color:var(--text-dim);line-height:1.5;}
.thread-actions{display:flex;gap:6px;margin-top:10px;}

/* Settings */
.settings-layout{display:grid;grid-template-columns:180px 1fr;gap:24px;}
.settings-nav{display:flex;flex-direction:column;gap:2px;}
.settings-nav-item{padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text-dim);transition:background .1s,color .1s;}
.settings-nav-item:hover{background:var(--bg-soft);color:var(--text);}
.settings-nav-item.active{background:var(--accent-soft);color:var(--accent-text);font-weight:500;}
.settings-section h3{font-size:15px;font-weight:600;margin:0 0 4px;}
.settings-section .desc{font-size:12.5px;color:var(--text-dim);margin-bottom:20px;}

/* Vista previa de Markdown: réplica del lector del escritorio (tema oscuro del sitio,
   acento verde por defecto). Las reglas comunes vienen de assets/prose.css. */
.md-preview{--neon:#39ff14;--neon-rgb:57,255,20;--neon-2:#00f0ff;--text:#e6e8ec;--text-dim:#a0a6b0;--text-faint:#6b7280;--border:#2a2f38;
  background:#14161a;color:var(--text);border:1px solid #2a2f38;border-radius:7px;padding:18px 22px;min-height:120px;font-size:13.5px;line-height:1.6;}
.md-preview h2{font-family:'Space Grotesk',var(--font-ui);font-size:18px;margin:24px 0 8px;color:var(--neon);}
.md-preview h3{font-size:15px;}
.md-preview h4{font-size:13.5px;}
.md-preview p,.md-preview li{color:var(--text);}
.md-preview a{color:var(--neon-2);}
.md-preview pre{font-size:12px;}
.md-preview img[data-external]{outline:2px dashed #ffb800;outline-offset:2px;}
.md-preview:empty::before{content:'La vista previa aparecerá aquí.';color:var(--text-faint);font-style:italic;}

/* Editor de posts */
.ed-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start;}
@media(max-width:1100px){.ed-layout{grid-template-columns:1fr;}}
.ed-title{font-size:18px;font-weight:600;padding:10px 12px;}
.ed-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border:1px solid var(--border);border-bottom:0;border-radius:7px 7px 0 0;background:var(--bg-soft);}
.ed-tb{min-width:30px;height:28px;padding:0 7px;border:1px solid transparent;border-radius:5px;background:none;color:var(--text-dim);font-size:12.5px;font-family:var(--font-mono);cursor:pointer;}
.ed-tb:hover{background:var(--bg-elev);color:var(--text);border-color:var(--border);}
.ed-tb:focus-visible,.ed-modes button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px;}
.ed-tb b,.ed-tb i,.ed-tb s{font-family:var(--font-ui);}
.ed-sep{width:1px;height:18px;background:var(--border);margin:0 4px;}
.ed-modes{margin-left:auto;display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.ed-modes button{border:0;background:var(--bg-elev);padding:4px 10px;font-size:12px;color:var(--text-dim);cursor:pointer;}
.ed-modes button+button{border-left:1px solid var(--border);}
.ed-modes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:500;}
.ed-panes{display:grid;grid-template-columns:1fr;border:1px solid var(--border);border-radius:0 0 7px 7px;height:max(420px,calc(100vh - 260px));overflow:hidden;background:var(--bg-elev);}
.ed-panes.split{grid-template-columns:1fr 1fr;}
.ed-panes.dragging{outline:2px dashed var(--accent);outline-offset:-4px;}
.ed-text{width:100%;height:100%;border:0;resize:none;outline:none;padding:14px 16px;background:transparent;color:var(--text);font-family:var(--font-mono);font-size:13px;line-height:1.65;tab-size:4;}
.ed-panes.split .ed-text{border-right:1px solid var(--border);}
.ed-panes .md-preview{border:0;border-radius:0;height:100%;overflow-y:auto;min-height:0;}
.ed-status{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 2px;font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}
.ed-status .warn{color:var(--warning);}
.ed-banner{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:9px 12px;border-radius:7px;margin-bottom:14px;font-size:13px;background:var(--accent-soft);color:var(--accent-text);}
.ed-banner.warn{background:rgba(202,138,4,.1);color:var(--warning);}
.ed-banner.error{background:rgba(220,38,38,.08);color:var(--danger);}
.ed-banner .push{margin-left:auto;display:flex;gap:6px;}
.ed-dirty{font-size:12px;color:var(--warning);align-self:center;}
.ed-help{margin-top:14px;}
.ed-help table{width:100%;border-collapse:collapse;font-size:12.5px;}
.ed-help td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-dim);}
.ed-help td:first-child{font-family:var(--font-mono);font-size:12px;color:var(--text);white-space:pre;width:45%;}
.ed-help kbd{font-family:var(--font-mono);font-size:11px;padding:1px 5px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;background:var(--bg-elev);}
.ed-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.ed-modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);width:min(760px,100%);max-height:82vh;display:flex;flex-direction:column;}
.ed-modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;}
.ed-modal-head .btn:first-of-type{margin-left:auto;}
.ed-modal-body{padding:14px 16px;overflow-y:auto;}
.ed-media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
.ed-media-opt{padding:0;border:1px solid var(--border);border-radius:7px;overflow:hidden;cursor:pointer;background:var(--bg-soft);text-align:left;color:inherit;font:inherit;}
.ed-media-opt img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.ed-media-opt span{display:block;padding:4px 6px;font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ed-media-opt:hover,.ed-media-opt:focus-visible{border-color:var(--accent);outline:none;}
.form-input[readonly]{background:var(--bg-soft);color:var(--text-dim);}
/* Notas */
.notes-help{display:flex;flex-wrap:wrap;gap:8px 20px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;color:var(--text-dim);}
.notes-help code{font-family:var(--font-mono);font-size:12px;background:var(--bg-soft);padding:1px 6px;border-radius:4px;color:var(--text);}
.notes-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
@media(max-width:1000px){.notes-layout{grid-template-columns:1fr;}}
.notes-textarea{height:480px;font-size:13px;line-height:24px;}
/* Réplica de la ventana Notas del escritorio (tema oscuro, líneas de libreta) */
.notes-preview{min-height:480px;max-height:480px;overflow-y:auto;border-radius:10px;border:1px solid #2a2f38;padding:12px 20px;
  background:#14161a repeating-linear-gradient(transparent,transparent 23px,rgba(57,255,20,.06) 23px,rgba(57,255,20,.06) 24px);
  background-position:0 12px;font-family:var(--font-mono);font-size:13px;line-height:24px;color:#e6e8ec;white-space:pre-wrap;word-break:break-word;}
.notes-preview .star{color:#39ff14;}
.notes-preview .scribble{color:#a0a6b0;}
/* Sobre mí */
.about-layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}
@media(max-width:1000px){.about-layout{grid-template-columns:1fr;}}
.about-card{margin-bottom:16px;}
.about-card-title{font-weight:600;font-size:14px;margin-bottom:14px;}
.about-card-title span{font-family:var(--font-mono);font-weight:400;font-size:11.5px;color:var(--text-faint);margin-left:6px;}
.about-dirty{font-size:12px;color:var(--warning);align-self:center;}
.about-msg{font-size:13px;padding:9px 12px;border-radius:7px;margin-bottom:14px;}
.about-msg.ok{background:var(--accent-soft);color:var(--success);}
.about-msg.error{background:rgba(220,38,38,.08);color:var(--danger);}
.about-links-head,.about-link-row{display:grid;grid-template-columns:120px 1fr 1.3fr auto;gap:8px;align-items:center;}
.about-links-head{font-size:11.5px;font-weight:500;color:var(--text-faint);margin-bottom:6px;}
.about-link-row{margin-bottom:8px;}
.about-link-actions{display:flex;gap:4px;}
.about-link-actions .btn{padding:5px 8px;}
@media(max-width:700px){.about-links-head{display:none;}.about-link-row{grid-template-columns:1fr;padding-bottom:10px;border-bottom:1px solid var(--border);}}
.about-avatar-preview{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#39ff14,#00f0ff);color:#000;font-family:var(--font-mono);font-weight:700;font-size:34px;}
.about-avatar-preview img{width:100%;height:100%;object-fit:cover;}
.about-avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:220px;overflow-y:auto;}
.about-avatar-opt{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:var(--bg-soft);}
.about-avatar-opt img{width:100%;height:100%;object-fit:cover;display:block;}
.about-avatar-opt.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.about-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.about-chips span{font-family:var(--font-mono);font-size:11.5px;padding:3px 9px;border:1px solid var(--border);border-radius:5px;color:var(--text-dim);background:var(--bg-soft);}
.md-preview .md-table table{font-size:12.5px;}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-faint);border-bottom:2px solid transparent;transition:color .1s,border-color .1s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent-text);border-bottom-color:var(--accent);}

@media(max-width:700px){
  .shell{grid-template-columns:0 1fr;}
  .sidebar{position:fixed;z-index:200;width:var(--sidebar-w);transform:translateX(-100%);transition:transform .22s;}
  .sidebar.open{transform:translateX(0);}
  .page{padding:16px;}
  .form-row{grid-template-columns:1fr;}
  .settings-layout{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="admin-root"></div>

<script src="assets/admin.js" defer></script>
</body>
</html>
